name: xnu

on:
  workflow_dispatch:
    inputs:
      macos_version:
        description: macOS release whose xnu to build (13.5 = xnu-8796, iOS 16 era)
        default: "13.5"
      kernel_config:
        description: RELEASE / DEVELOPMENT / DEBUG
        default: DEVELOPMENT
      machine_config:
        description: xnu MACHINE_CONFIG
        default: SWEET
      keep_going:
        description: make -k (collect all compile errors in one run)
        default: "true"
  push:
    branches: [main, "claude/**"]
    paths:
      - "xnu/patches/**"
      - "shim/**"
      - "tools/**"
      - "gui/**"
      - ".github/workflows/xnu.yml"

concurrency:
  group: xnu-${{ github.ref }}
  cancel-in-progress: true

env:
  DXB_REPO: https://github.com/blacktop/darwin-xnu-build
  DXB_SHA: 663906528d1cd5ea8fde7de6f16de73db9511549
  MACOS_VERSION: ${{ inputs.macos_version || '13.5' }}
  KERNEL_CONFIG: ${{ inputs.kernel_config || 'DEVELOPMENT' }}
  MACHINE_CONFIG: ${{ inputs.machine_config || 'SWEET' }}

jobs:
  # Shim (S-BOOT boot loader), its hand-off checks in QEMU, the ARMv8.1
  # atomics emulation unit test and the repository checks: no Apple tools.
  shim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Deps
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q clang lld llvm qemu-system-arm python3-numpy python3-pil
      - name: Repository checks
        run: python3 tools/validate-repo.py
      - name: LSE emulation unit test
        run: python3 tools/test/lse_test.py
      - name: ISA scanner test (check-armv80.py on clang Mach-O objects)
        run: python3 tools/test/check_armv80_test.py
      - name: Build shim
        run: SHIM_IMAGE_ONLY=1 bash shim/build.sh
      - name: Shim hand-off in QEMU (ramdisk, appended, boot core 0x102, EL2 entry)
        run: |
          python3 tools/qemu-j7.py
          python3 tools/qemu-j7.py --in-kernel
          python3 tools/qemu-j7.py --boot-mpidr 0x102
          python3 tools/qemu-j7.py --el2 --boot-mpidr 0x3 --keep qemu-out
      - name: Shim restart without the power button in QEMU (Vol+ TWRP, Vol- Download, none)
        run: |
          python3 tools/qemu-j7.py --escape up
          python3 tools/qemu-j7.py --escape down
          python3 tools/qemu-j7.py --escape none
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shim
          path: |
            shim/out/Image
            qemu-out/fb.png

  build:
    # macos-14 (Xcode 15) was retired on 2026-11-02. Xcode 16's iig emits
    # IORPC.kernelContent: patch 0088 backports that field from xnu-11215.
    runs-on: macos-15
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Fetch build script
        run: |
          git init -q dxb
          git -C dxb fetch -q --depth 1 "$DXB_REPO" "$DXB_SHA"
          git -C dxb checkout -q FETCH_HEAD
          # 12.5-14.3 use the top-level patches dir; ours go next to blacktop's
          cp xnu/patches/*.patch xnu/patches/*.sh dxb/patches/
          # libfirehose_kernel (linked into the kernel): add the plain arm64
          # slice and build it for the Cortex-A53 (see the script)
          python3 tools/dxb-prepare.py dxb
          ls dxb/patches

      - name: Deps
        run: |
          brew install jq gum bash cmake ninja
          # build.sh only checks that xcodes exists (Xcode is preinstalled); no bottle on macOS 14
          printf '#!/bin/sh\nexit 0\n' | sudo tee /usr/local/bin/xcodes >/dev/null
          sudo chmod +x /usr/local/bin/xcodes
          sw_vers
          ls -d /Applications/Xcode*.app
          XC=$(ls -d /Applications/Xcode_*.app | sort -V | head -1)
          echo "DEVELOPER_DIR=$XC/Contents/Developer" >> "$GITHUB_ENV"
          sudo xcode-select -s "$XC"
          xcodebuild -version
          xcrun --find iig

      - name: Build
        working-directory: dxb
        env:
          # keep going after errors so one run reports every compile failure
          MAKEFLAGS: ${{ inputs.keep_going == 'false' && '' || '-k' }}
        run: |
          set -o pipefail
          bash build.sh 2>&1 | tee ../build.log

      - name: Verify (every repo patch applied, kernel is ARMv8.0 only)
        run: |
          # dxb skips a patch that does not apply with only a warning.
          if grep -E 'Skipping patch .*/[0-9]{4}-' build.log; then
            echo "::error::a repository patch was skipped"; exit 1
          fi
          for p in xnu/patches/*.patch; do
            grep -q "Applying patch: .*/$(basename "$p")" build.log || { echo "::error::$p not applied"; exit 1; }
          done
          echo "all $(ls xnu/patches/*.patch | wc -l) patches applied"
          K=dxb/fakeroot/System/Library/Kernels/kernel.development.sweet
          file "$K"
          pip3 install --break-system-packages -q numpy
          # K256: SHA-256 round constants kept in __text by
          # osfmk/arm64/corecrypto/sha256_compress_arm64.s (data, never
          # executed); K256[57] = 0x78a5636f has an LSE encoding.
          python3 tools/check-armv80.py --strict --min-code-kib 4096 --ignore-symbol K256 "$K"

      - name: Package build tree for local compiles
        if: always()
        run: |
          # Generated headers, config option headers, mig output and the patched
          # source: enough to re-run any single compile command from the log locally.
          SDK=$(xcrun --sdk macosx --show-sdk-path)
          mkdir -p sdk-kernel-platform
          cp -R "$SDK/System/Library/Frameworks/Kernel.framework/Versions/A/PrivateHeaders/platform" sdk-kernel-platform/ || true
          tar czf buildtree.tgz \
            --exclude='*.o' --exclude='*.cpo' --exclude='*.a' --exclude='*.dSYM' --exclude='*.unstripped' \
            --exclude='kernel.development.*' --exclude='.git' \
            -C dxb build/xnu.obj fakeroot/usr/local/include xnu \
            -C .. sdk-kernel-platform
          ls -la buildtree.tgz

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-buildtree
          path: buildtree.tgz
          retention-days: 7

      - name: Inspect closed KDK support libs
        if: always()
        run: |
          mkdir -p out/kdk-libs
          for lib in /Library/Developer/KDKs/*/System/Library/KernelSupport/lib*.a; do
            b=$(basename "$lib" .a)
            ar t "$lib" > "out/kdk-libs/$b.members.txt" 2>&1 || true
            nm -m "$lib" > "out/kdk-libs/$b.nm.txt" 2>&1 || true
            lipo -info "$lib" >> out/kdk-libs/arch.txt 2>&1 || true
          done
          ls -la out/kdk-libs

      - name: Collect
        if: always()
        run: |
          mkdir -p out
          cp -R dxb/fakeroot/System/Library/Kernels/. out/ 2>/dev/null || true
          ls -la out
          (cd out && shasum -a 256 kernel.* > SHA256SUMS) || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xnu-kernel
          path: out/
          if-no-files-found: warn

  # Mac app (gui/): build, self-test, Heimdall build and IPSW helper on a real
  # Mac, PNG of every wizard step.
  app:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Build the app (swiftc, universal, macOS 13+)
        run: bash gui/build-app.sh "$RUNNER_TEMP/app"
      - name: Self-test
        run: '"$RUNNER_TEMP/app/iOS Galaxy.app/Contents/MacOS/iOS Galaxy" --selftest'
      - name: Heimdall build (tools/heimdall-build.sh, what the app's install button runs)
        run: |
          bash tools/heimdall-build.sh "$RUNNER_TEMP/support"
          "$RUNNER_TEMP/support/bin/heimdall" version
          "$RUNNER_TEMP/support/bin/heimdall" detect && exit 1 || echo "detect without a phone: exit $? (expected 1)"
      - name: IPSW helper (version list, DeviceTree-only download)
        run: |
          brew install lzfse
          python3 tools/ipsw-fetch.py list | head -5
          python3 tools/ipsw-fetch.py fetch 20H392 --devicetree-only --out "$RUNNER_TEMP/ipsw"
          python3 tools/mkadt.py "$RUNNER_TEMP/j7neo.adt"
      - name: Snapshots of every step
        continue-on-error: true
        env:
          IOSGALAXY_REPO: ${{ github.workspace }}
        run: |
          bin="$RUNNER_TEMP/app/iOS Galaxy.app/Contents/MacOS/iOS Galaxy"
          "$bin" --snapshots "$RUNNER_TEMP/capturas" &
          pid=$!
          for i in $(seq 150); do kill -0 $pid 2>/dev/null || break; sleep 1; done
          kill $pid 2>/dev/null || true
          ls -la "$RUNNER_TEMP/capturas"
          (cd "$RUNNER_TEMP" && zip -qr capturas.zip capturas)
      - name: Collect
        if: always()
        run: |
          mkdir -p app-out
          cp "$RUNNER_TEMP/app/iOS-Galaxy.app.zip" app-out/ 2>/dev/null || true
          cp "$RUNNER_TEMP/capturas.zip" app-out/ 2>/dev/null || true
          ls -la app-out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-galaxy-app
          path: app-out/

  # One "latest" release with the kernel and the app, replaced by every run
  # on the work branch where all jobs pass (download needs no GitHub login).
  # (job-level `if` cannot read `env`, so the branch is written here)
  release:
    needs: [shim, build, app]
    if: github.event_name != 'pull_request' && github.ref_name == 'claude/exciting-ritchie-47zds5'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xnu-kernel
          path: kernel
      - uses: actions/download-artifact@v4
        with:
          name: ios-galaxy-app
          path: app
      - name: Replace the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p rel
          cp kernel/kernel.development.sweet app/iOS-Galaxy.app.zip rel/
          [ -f app/capturas.zip ] && cp app/capturas.zip rel/
          (cd rel && sha256sum kernel.development.sweet iOS-Galaxy.app.zip > SHA256SUMS && cat SHA256SUMS)
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          cat > notes.md <<EOF
          Kernel y app de la CI (run $GITHUB_RUN_ID, commit ${GITHUB_SHA:0:7}, rama $GITHUB_REF_NAME).

          - kernel.development.sweet: los 88+ parches aplicados y sin instrucciones posteriores a ARMv8.0 (paso Verify).
          - iOS-Galaxy.app.zip: la app para Mac (macOS 13+, Apple Silicon e Intel), firmada ad hoc.
          - capturas.zip: cada paso de la app, capturado en la CI.

          $run_url
          EOF
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest rel/* --target "$GITHUB_SHA" --title "latest (CI ${GITHUB_SHA:0:7})" --notes-file notes.md
          gh release view latest
